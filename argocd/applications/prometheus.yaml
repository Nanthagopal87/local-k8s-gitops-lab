# Argo CD Application: Prometheus for the coe IPAM trend charts (ADR-009). Multi-source, like
# netbox (ADR-008): the upstream chart pinned to an exact version, values from this repo.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: prometheus
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: local-k8s-gitops-lab
spec:
  project: default
  sources:
    - repoURL: https://prometheus-community.github.io/helm-charts
      chart: prometheus
      # 2026-11-11, Prometheus v3.16.0. Not 30.x: a new major released 2026-11-25.
      targetRevision: 29.47.2
      helm:
        releaseName: prometheus
        valueFiles:
          - $values/argocd/apps/prometheus/values.yaml
    - repoURL: https://github.com/Nanthagopal87/local-k8s-gitops-lab.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  # Manual sync (no syncPolicy), like every Application here except phase7-sandbox.
