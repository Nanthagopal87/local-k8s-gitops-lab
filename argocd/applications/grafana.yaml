# Argo CD Application: Grafana with the coe IPAM dashboard (ADR-009). Three sources: the
# upstream chart (moved to grafana-community; the grafana/helm-charts copy is deprecated),
# values from this repo, and the dashboards-as-code ConfigMap.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: grafana
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: local-k8s-gitops-lab
spec:
  project: default
  sources:
    - repoURL: https://grafana-community.github.io/helm-charts
      chart: grafana
      targetRevision: 14.4.1   # 2026-11-10, Grafana 13.3.1
      helm:
        releaseName: grafana
        valueFiles:
          - $values/argocd/apps/grafana/values.yaml
    - repoURL: https://github.com/Nanthagopal87/local-k8s-gitops-lab.git
      targetRevision: main
      ref: values
    - repoURL: https://github.com/Nanthagopal87/local-k8s-gitops-lab.git
      targetRevision: main
      path: argocd/apps/grafana/dashboards
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  # Manual sync (no syncPolicy), like every Application here except phase7-sandbox.
