# MANUAL SECRET — NOT applied by Argo CD, NOT listed in ../kustomization.yaml's resources.
#
# Follows the same boundary ADR-003 already established for the Phase 2 fake demo Secret:
# even an obviously-fake credential stays outside GitOps management, so that bringing a
# Secret under Argo CD never becomes a habit a real credential could later follow by
# accident. Applied once by hand: `kubectl apply -f argocd/apps/atlantis/manual/secret.yaml`.
#
# The value is the literal string "fake" — Atlantis's own documented pattern for local
# setup where no real GitHub API call is ever authenticated (this lab only needs anonymous,
# unauthenticated `git clone` of its own public repository). Committing this file to a
# public repository is safe for exactly that reason: it holds no real secret material.
apiVersion: v1
kind: Secret
metadata:
  name: atlantis-gh-token
  namespace: atlantis
  labels:
    app.kubernetes.io/name: atlantis
    app.kubernetes.io/part-of: atlantis-learning-experiment
    learning-only: "true"
type: Opaque
stringData:
  token: fake
