# Atlantis stores checked-out repo state and plan output on disk; losing it on every Pod
# restart is avoidable at negligible cost, so this follows Atlantis's own documented
# recommendation (persistent storage) rather than an emptyDir. Same StorageClass and the
# same Prune=false,Delete=false guardrail as the Phase 2 demo-data PVC.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: atlantis-data
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    app.kubernetes.io/name: atlantis
    app.kubernetes.io/part-of: atlantis-learning-experiment
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
