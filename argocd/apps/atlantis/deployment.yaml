# Atlantis, deployed as an ordinary Kubernetes workload and reconciled by Argo CD like every
# other Application in this lab. One replica: Atlantis's official guidance suggests a
# StatefulSet for stable per-replica identity, which is only relevant above one replica, so a
# Deployment (as used for every other workload here) is equivalent and consistent.
#
# Official image `ghcr.io/runatlantis/atlantis` (unsuffixed/Alpine tag) already bundles
# OpenTofu; no custom build or extra download step is needed. It runs as a non-root `atlantis`
# user by default (since v0.26.0).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: atlantis
  labels:
    app.kubernetes.io/name: atlantis
    app.kubernetes.io/part-of: atlantis-learning-experiment
spec:
  replicas: 1
  strategy:
    type: Recreate # avoids two Pods ever holding the ReadWriteOnce PVC at once
  selector:
    matchLabels:
      app.kubernetes.io/name: atlantis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: atlantis
        app.kubernetes.io/part-of: atlantis-learning-experiment
    spec:
      terminationGracePeriodSeconds: 30
      automountServiceAccountToken: false
      # fsGroup, not a specific runAsUser: the image already runs as its own baked-in
      # non-root `atlantis` user; fsGroup only grants that user's group write access to the
      # mounted volume, without this manifest having to know or guess the exact UID.
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: atlantis
          image: ghcr.io/runatlantis/atlantis:v0.48.0
          ports:
            - name: http
              containerPort: 4141
          envFrom:
            - configMapRef:
                name: atlantis-config
          env:
            - name: ATLANTIS_GH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: atlantis-gh-token
                  key: token
          volumeMounts:
            - name: data
              mountPath: /atlantis
          # Atlantis is not a high-throughput service; long probe intervals match Atlantis's
          # own documented Kubernetes example (avoids flooding its logs with health-check
          # requests).
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 60
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 60
          resources:
            # Atlantis's own documented Kubernetes example: 256Mi/100m for both request and
            # limit. Measured against the live Pod after deployment; see the validation report.
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 100m, memory: 256Mi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: atlantis-data
