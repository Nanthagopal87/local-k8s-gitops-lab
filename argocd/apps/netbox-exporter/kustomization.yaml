# NetBox IPAM exporter (ADR-009): a standard-library Python script from this folder, run on a
# pinned official python image (no custom image build: this lab has no Docker). The
# script is shipped as a ConfigMap; kustomize adds a content hash to its name, so editing
# exporter.py rolls the Deployment automatically.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: netbox-exporter-script
    files:
      - exporter.py

labels:
  - pairs:
      app.kubernetes.io/part-of: observability-learning-experiment
    includeSelectors: false
