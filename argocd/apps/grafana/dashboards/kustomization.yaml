# Grafana dashboards as code: every *.json here becomes a key of the grafana-dashboards-coe
# ConfigMap, which the Grafana chart mounts under /var/lib/grafana/dashboards/coe
# (values.yaml: dashboardProviders + dashboardsConfigMaps). Fixed name (no hash suffix)
# because the chart refers to it by name.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

configMapGenerator:
  - name: grafana-dashboards-coe
    files:
      - coe-ipam.json
    options:
      disableNameSuffixHash: true
      labels:
        app.kubernetes.io/part-of: observability-learning-experiment
