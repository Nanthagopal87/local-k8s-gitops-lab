# Namespace for service-a in the dev environment. The name is a naming CONTRACT with the ApplicationSet
# (argocd/applicationsets/phase7-git-generator.yaml): p7g-<service>-<environment>.
# Prune=false,Delete=false: a Namespace is never a prune candidate (ADR-003, ADR-006).
apiVersion: v1
kind: Namespace
metadata:
  name: p7g-service-a-dev
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  labels:
    app.kubernetes.io/part-of: phase7-git-generator
    purpose: learning
