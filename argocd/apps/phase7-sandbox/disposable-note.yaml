# A deliberately disposable ConfigMap. It is the resource that Experiment C removes from Git to
# observe pruning. It holds nothing that matters and no workload references it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: disposable-note
  labels:
    app.kubernetes.io/part-of: phase7-sandbox
data:
  note: "safe to delete; exists only for the Phase 7 prune experiment"
