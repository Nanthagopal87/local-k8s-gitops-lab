# Fictional IP plan for an invented organisation ("Example Org"), used only to practise
# NetBox IPAM in this lab. Nothing here describes a real network: 10.192.0.0/12 was picked
# arbitrarily from RFC 1918 space, and the environment names and sizes are generic.
#
# Layout: one /12 for the organisation, one /16 supernet per environment (status
# "container"), and inside each environment the ranges a Google Cloud style setup needs:
# a hub/shared-services block, workload subnets, and GKE node, Pod and Service ranges
# (Pods get the large blocks). Free space is left on purpose, so new requests can be served
# by NetBox's available-prefixes API (see allocate.py).
#
# Applied with seed_ip_plan.py (idempotent: re-running changes nothing).

rir:
  name: RFC 1918
  slug: rfc-1918
  is_private: true

aggregate:
  prefix: 10.192.0.0/12
  description: "Example Org private address space (fictional)"

roles:
  - {name: Environment supernet, slug: environment-supernet}
  - {name: Hub / shared services, slug: hub-shared}
  - {name: Workload subnet, slug: workload-subnet}
  - {name: GKE nodes, slug: gke-nodes}
  - {name: GKE Pods (secondary range), slug: gke-pods}
  - {name: GKE Services (secondary range), slug: gke-services}

tags:
  - {name: env-prod, slug: env-prod, color: f44336}
  - {name: env-nonprod, slug: env-nonprod, color: 2196f3}
  - {name: env-shared, slug: env-shared, color: 9e9e9e}

# Each environment: a /16 container plus its child prefixes.
environments:
  - name: shared
    supernet: 10.192.0.0/16
    tag: env-shared
    prefixes:
      - {prefix: 10.192.0.0/22, role: hub-shared, description: "Hub VPC - shared services (DNS forwarders, proxies)"}
      - {prefix: 10.192.4.0/24, role: hub-shared, description: "Hybrid connectivity - interconnect / VPN attachments", status: reserved}
      - {prefix: 10.192.8.0/22, role: workload-subnet, description: "Platform tools subnet (CI runners, GitOps controllers)"}
  - name: dev
    supernet: 10.193.0.0/16
    tag: env-nonprod
    prefixes:
      - {prefix: 10.193.0.0/22, role: workload-subnet, description: "Dev - primary region workload subnet"}
      - {prefix: 10.193.4.0/22, role: gke-nodes, description: "Dev GKE cluster - nodes"}
      - {prefix: 10.193.64.0/18, role: gke-pods, description: "Dev GKE cluster - Pods"}
      - {prefix: 10.193.8.0/24, role: gke-services, description: "Dev GKE cluster - Services"}
  - name: test
    supernet: 10.194.0.0/16
    tag: env-nonprod
    prefixes:
      - {prefix: 10.194.0.0/22, role: workload-subnet, description: "Test - primary region workload subnet"}
      - {prefix: 10.194.4.0/22, role: gke-nodes, description: "Test GKE cluster - nodes"}
      - {prefix: 10.194.64.0/18, role: gke-pods, description: "Test GKE cluster - Pods"}
      - {prefix: 10.194.8.0/24, role: gke-services, description: "Test GKE cluster - Services"}
  - name: prod
    supernet: 10.195.0.0/16
    tag: env-prod
    prefixes:
      - {prefix: 10.195.0.0/22, role: workload-subnet, description: "Prod - primary region workload subnet"}
      - {prefix: 10.195.4.0/22, role: workload-subnet, description: "Prod - DR region workload subnet"}
      - {prefix: 10.195.8.0/22, role: gke-nodes, description: "Prod GKE cluster - nodes"}
      - {prefix: 10.195.64.0/18, role: gke-pods, description: "Prod GKE cluster - Pods"}
      - {prefix: 10.195.12.0/24, role: gke-services, description: "Prod GKE cluster - Services"}
# 10.196.0.0/14 and the rest of the /12 stay unallocated for future environments.
