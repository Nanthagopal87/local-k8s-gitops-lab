# CloudOpsEdge (coe): IPAM source of truth, applied to NetBox with seed.py.
#
# Built up in stages; each stage is a section below. Order matters: objects can only
# reference objects defined in an earlier section (or already in NetBox).
#
#   1. Organisation and address space  <- done
#   2. Business units (tenants)         <- done
#   3. Environments, VPCs, subnets      <- done
#
# Cloud provider: Google Cloud. Regions: asia-south1 (Mumbai), asia-south2 (Delhi).
# Private space: RFC 1918 for VPC subnets, GKE nodes and Services; RFC 6598 (100.64.0.0/10)
# for GKE Pod ranges only.

tenant_groups:
  - name: CloudOpsEdge
    slug: coe
    description: CloudOpsEdge organisation; business units are tenants under this group

rirs:
  - name: RFC 1918
    slug: rfc-1918
    is_private: true
    description: Private address space (10/8, 172.16/12, 192.168/16)
  - name: RFC 6598
    slug: rfc-6598
    is_private: true
    description: Shared address space 100.64.0.0/10; at coe used only for GKE Pod ranges
  - name: RFC 3927
    slug: rfc-3927
    is_private: true
    description: IPv4 link-local 169.254.0.0/16; BGP peering on Interconnect and HA VPN
  - name: RFC 6996
    slug: rfc-6996
    is_private: true
    description: Private 16-bit ASNs 64512-65534; Cloud Router ASNs

aggregates:
  - {prefix: 10.0.0.0/8,      rir: rfc-1918, description: "RFC 1918 - primary block for VPC subnets"}
  - {prefix: 172.16.0.0/12,   rir: rfc-1918, description: "RFC 1918 - not allocated yet"}
  - {prefix: 192.168.0.0/16,  rir: rfc-1918, description: "RFC 1918 - not allocated yet"}
  - {prefix: 100.64.0.0/10,   rir: rfc-6598, description: "RFC 6598 - GKE Pod (secondary) ranges only"}
  - {prefix: 169.254.0.0/16,  rir: rfc-3927, description: "RFC 3927 - BGP peering ranges (Interconnect, HA VPN)"}

regions:
  - {name: Google Cloud, slug: gcp, description: Google Cloud regions used by coe}
  - {name: India, slug: gcp-india, parent: gcp, description: Google Cloud regions in India}

sites:
  - name: asia-south1 (Mumbai)
    slug: asia-south1
    region: gcp-india
    status: active
    description: Google Cloud region asia-south1, Mumbai - primary region
  - name: asia-south2 (Delhi)
    slug: asia-south2
    region: gcp-india
    status: active
    description: Google Cloud region asia-south2, Delhi - secondary / DR region

# --- Stage 2: business units (tenants under the coe group) ---------------------------------
tenants:
  - name: bootstrap
    slug: bootstrap
    group: coe
    description: Organisation bootstrap - automation, IaC state and CI identities
  - name: platform
    slug: platform
    group: coe
    description: Shared platform - landing zone, hub networking, shared services
  - name: bu1
    slug: bu1
    group: coe
    description: Business unit 1
  - name: bu2
    slug: bu2
    group: coe
    description: Business unit 2




# --- Stage 3: environments, VPCs and subnets (agreed 2026-11-26) -------------------------
# Generated from the agreed rules, then kept here as the source of truth. Containers hold
# other prefixes; active prefixes are real ranges. dc = asia-south1 (Mumbai), dr = asia-south2
# (Delhi); only prd has dr. Each region block gets: /22 app (.0), /22 GKE nodes, /22 GKE
# Services (offsets .0, .4, .8), /24 proxy-only (.12), /24 PSC NAT (.13), /24 serverless (.14),
# /20 Private Service Access (.16), /22 db (.32), /22 dwh (.36); the rest is free for allocate.py.
roles:
  - {name: "Tenant block", slug: tenant-block}
  - {name: "Hub", slug: hub}
  - {name: "Hub VPC", slug: hub-vpc}
  - {name: "Spoke VPC (Shared VPC)", slug: spoke-vpc}
  - {name: "Region block", slug: region-block}
  - {name: "App subnet", slug: app-subnet}
  - {name: "DB subnet", slug: db-subnet}
  - {name: "DWH subnet", slug: dwh-subnet}
  - {name: "CI/CD workers", slug: cicd-workers}
  - {name: "Shared services", slug: shared-services}
  - {name: "GKE nodes", slug: gke-nodes}
  - {name: "GKE Services", slug: gke-services}
  - {name: "GKE Pods", slug: gke-pods}
  - {name: "Proxy-only subnet", slug: proxy-only}
  - {name: "PSC NAT subnet", slug: psc-nat}
  - {name: "Private Service Access", slug: psa}
  - {name: "Serverless connectors", slug: serverless-connector}
  - {name: "BGP peering (link-local)", slug: bgp-peering}
tags:
  - {name: env-dev, slug: env-dev, color: 4caf50}
  - {name: env-stg, slug: env-stg, color: ff9800}
  - {name: env-npd, slug: env-npd, color: 2196f3}
  - {name: env-prd, slug: env-prd, color: f44336}
asns:
  - {asn: 64512, rir: rfc-6996, tenant: platform, sites: [asia-south1], description: "Cloud Router - hub prd hybridconn dc"}
  - {asn: 64513, rir: rfc-6996, tenant: platform, sites: [asia-south2], description: "Cloud Router - hub prd hybridconn dr"}
  - {asn: 64514, rir: rfc-6996, tenant: platform, sites: [asia-south1], description: "Cloud Router - hub npd hybridconn dc"}
custom_fields:
  - {name: gcp_project, label: "GCP project", type: text, object_types: [ipam.prefix], group_name: GCP, validation_regex: "^[a-z][a-z0-9-]{4,28}[a-z0-9]$", description: "Project that owns the VPC (Shared VPC host); planned name"}
  - {name: gcp_vpc, label: "GCP VPC network", type: text, object_types: [ipam.prefix], group_name: GCP, validation_regex: "^[a-z]([-a-z0-9]{0,61}[a-z0-9])?$", description: "VPC network name; planned name"}
prefixes:
  - {prefix: 10.0.0.0/12, status: container, role: tenant-block, description: "Foundation block: platform hubs and workloads, bootstrap"}
  - {prefix: 10.0.0.0/16, status: container, role: hub, tenant: platform, tags: [env-prd], description: "Hub - prd (landingzone + hybridconn)", custom_fields: {gcp_project: coe-net-hub-prd}}
  - {prefix: 10.0.0.0/18, status: container, role: hub-vpc, tenant: platform, site: asia-south1, tags: [env-prd], description: "Hub prd - landingzone VPC - dc (asia-south1)", custom_fields: {gcp_project: coe-net-hub-prd, gcp_vpc: vpc-landingzone-prd}}
  - {prefix: 10.0.64.0/18, status: container, role: hub-vpc, tenant: platform, site: asia-south2, tags: [env-prd], description: "Hub prd - landingzone VPC - dr (asia-south2)", custom_fields: {gcp_project: coe-net-hub-prd, gcp_vpc: vpc-landingzone-prd}}
  - {prefix: 10.0.128.0/18, status: container, role: hub-vpc, tenant: platform, site: asia-south1, tags: [env-prd], description: "Hub prd - hybridconn VPC - dc (asia-south1)", custom_fields: {gcp_project: coe-net-hub-prd, gcp_vpc: vpc-hybridconn-prd}}
  - {prefix: 10.0.192.0/18, status: container, role: hub-vpc, tenant: platform, site: asia-south2, tags: [env-prd], description: "Hub prd - hybridconn VPC - dr (asia-south2)", custom_fields: {gcp_project: coe-net-hub-prd, gcp_vpc: vpc-hybridconn-prd}}
  - {prefix: 10.0.0.0/24, role: shared-services, tenant: platform, site: asia-south1, tags: [env-prd], description: "Hub prd landingzone dc - shared services (DNS inbound forwarding, proxies)", custom_fields: {gcp_project: coe-net-hub-prd, gcp_vpc: vpc-landingzone-prd}}
  - {prefix: 10.0.1.0/24, role: proxy-only, tenant: platform, site: asia-south1, tags: [env-prd], description: "Hub prd landingzone dc - proxy-only subnet", custom_fields: {gcp_project: coe-net-hub-prd, gcp_vpc: vpc-landingzone-prd}}
  - {prefix: 10.0.64.0/24, role: shared-services, tenant: platform, site: asia-south2, tags: [env-prd], description: "Hub prd landingzone dr - shared services (DNS inbound forwarding, proxies)", custom_fields: {gcp_project: coe-net-hub-prd, gcp_vpc: vpc-landingzone-prd}}
